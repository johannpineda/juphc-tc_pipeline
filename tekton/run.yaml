apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  generateName: tax-calculator-pipeline-run-
spec:
  pipelineRef:
    name: tax-calculator-pipeline
  params:
    - name: image-url
      value: icr.io/<YOUR_NAMESPACE>/tax-calculator:latest
  workspaces:
    - name: pipeline-workspace
      persistentVolumeClaim:
        claimName: tax-calculator-pvc
